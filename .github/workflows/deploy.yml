name: Deploy Lambda with S3 Trigger

on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:
    inputs:
      region:
        description: "AWS Region to deploy"
        required: true
        default: us-east-1
        type: choice
        options:
          - us-east-1
          - us-west-2
          - ap-south-1
      bucketName:
        description: "S3 bucket name for artifacts"
        required: true
        default: my-s3-bucket-us-east-1-042470866308

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Default bucket for push events
      BUCKET_NAME: my-s3-bucket-us-east-1-042470866308
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -t src/

      - name: Zip Lambda package
        run: |
          cd src
          zip -r ../my-lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region || 'us-east-1' }}

      - name: Upload to S3
        id: upload
        run: |
          VERSION_ID=$(aws s3api put-object \
            --bucket my-s3-bucket-${{ github.event.inputs.region || 'us-east-1' }}-${{ secrets.AWS_ACCOUNT_ID }} \
            --key artifacts/my-lambda.zip \
            --body my-lambda.zip \
            --query VersionId --output text)
          echo "VERSION_ID=$VERSION_ID" >> $GITHUB_ENV

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file lambda.yml \
            --stack-name my-lambda-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ github.event.inputs.region || 'us-east-1' }} \
            --parameter-overrides \
              ArtifactBucketName=${{ github.event.inputs.bucketName || env.BUCKET_NAME }} \
              ArtifactKey=artifacts/my-lambda.zip \
              ArtifactVersionId=$VERSION_ID

