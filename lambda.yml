AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda function with IAM role and S3 trigger (prefix + suffix filter)

Resources:
  MyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  MyLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: my-lambda-learning-function
      Runtime: python3.12
      Handler: main.lambda_handler
      Role: !GetAtt MyLambdaRole.Arn
      CodeUri: ./src   # local source folder (SAM style)
      Events:
        S3Trigger:
          Type: S3
          Properties:
            Bucket: !Sub my-s3-bucket-${AWS::Region}-${AWS::AccountId}
            Events:
              - s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: inbound/
                  - Name: suffix
                    Value: .json

Outputs:
  LambdaArn:
    Value: !GetAtt MyLambdaFunction.Arn
    Description: ARN of the deployed Lambda function
  ArtifactBucketName:
    Value: !Sub my-s3-bucket-${AWS::Region}-${AWS::AccountId}
    Description: Name of the artifact bucket used
