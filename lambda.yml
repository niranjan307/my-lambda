AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda function with IAM role and S3 trigger (prefix filter)

Resources:
  MyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: my-lambda-learning-function
      Runtime: python3.12
      Handler: main.lambda_handler
      Role: !GetAtt MyLambdaRole.Arn
      Code:
        S3Bucket: !Sub my-s3-bucket-${AWS::Region}-${AWS::AccountId}
        S3Key: artifacts/my-lambda.zip

  MyLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MyLambdaFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::my-s3-bucket-${AWS::Region}-${AWS::AccountId}

Outputs:
  LambdaArn:
    Value: !GetAtt MyLambdaFunction.Arn
    Description: ARN of the deployed Lambda function
  ArtifactBucketName:
    Value: !Sub my-s3-bucket-${AWS::Region}-${AWS::AccountId}
    Description: Name of the artifact bucket used
