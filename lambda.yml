AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda function with IAM role and S3 trigger (prefix filter)

Resources:
  MyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: my-lambda-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3fullAccess

  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: my-lambda-learning-function
      Runtime: python3.12
      Handler: main.lambda_handler
      Role: !GetAtt MyLambdaRole.Arn
      Code:
        S3Bucket: my-s3-bucket-${AWS::Region}-${AWS::AccountId}
        S3Key: artifacts/my-lambda.zip

  MyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: my-s3-bucket-${AWS::Region}-${AWS::AccountId}

  MyBucketNotification:
    Type: AWS::S3::BucketNotification
    Properties:
      Bucket: !Ref MyBucket
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:Put
            Function: !GetAtt MyLambdaFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: inbound/

  MyLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MyLambdaFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt MyBucket.Arn
