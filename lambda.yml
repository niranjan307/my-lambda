AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda function with IAM role and S3 trigger (prefix filter)

Parameters:
  ArtifactBucketName:
    Type: String
  ArtifactKey:
    Type: String
  ArtifactVersionId:
    Type: String

Resources:
  MyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonsqsFullAccess

  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: my-lambda-learning-function
      Runtime: python3.12
      Handler: main.lambda_handler
      Role: !GetAtt MyLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ArtifactKey
        S3ObjectVersion: !Ref ArtifactVersionId

  MyLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MyLambdaFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::my-s3-bucket-${AWS::Region}-${AWS::AccountId}
